// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    // إصدار أداة بناء الأندرويد - متوافق مع Gradle 8.2+
    id 'com.android.application' version '8.2.0' apply false
    id 'com.android.library' version '8.2.0' apply false
    
    // إصدار لغة كوتلن - ضروري جداً لتعريف المترجم
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    
    // إضافة KAPT لمعالجة مكتبات مثل Glide
    id 'org.jetbrains.kotlin.kapt' version '1.9.22' apply false
}

// بديل allprojects في النسخ الحديثة يتم ضبطه غالباً في settings.gradle
// ولكن سنبقي على تعريف المهام الأساسية هنا
task clean(type: Delete) {
    delete rootProject.buildDir
}
