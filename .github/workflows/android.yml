name: Build FIX ENGINE APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin' # توزيعة ممتازة ومستقرة جداً لـ Android
          cache: 'gradle'

      - name: Generate New Gradle Wrapper
        # هنا نقوم بإنشاء الـ Wrapper في كل مرة لضمان نظافة بيئة البناء
        run: gradle wrapper --gradle-version 8.2

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        # استخدام ./gradlew لضمان استخدام النسخة التي أنشأناها للتو
        # أضفت --no-daemon لأنها أفضل في بيئات الـ CI لتجنب تعليق العمليات
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIX-ENGINE-Build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 5 # تقليل الأيام للحفاظ على مساحة التخزين في حسابك
