name: Build Abdullah Store APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate New Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        # 🛠️ تم تصحيح المحاذاة والمسافات هنا لتفادي انهيار البناء (Parsing Error)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/fixengine.jks

      - name: Build Release APK
        # 🛠️ تم إخراج الـ run خارج الـ env لكي ينفذ الجرادل الأمر الفعلي للتوقيع والـ Build
        env:
          SIGNING_STORE_FILE: fixengine.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abdullah-Store-Build-${{ github.run_number }}
          # 🛠️ تم تعديل المسار هنا ليرفع لك النسختين (الـ Release الموقعة الفولاذية والـ Debug معا) لكي تحمل ما تشاء منها
          path: app/build/outputs/apk/**/*.apk
          retention-days: 5
