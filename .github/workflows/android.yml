name: Build FIX ENGINE APK

on:
  push:
    branches: [ "main", "master" ] # سيعمل البناء عند الرفع على الفروع الأساسية
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt' # توزيعة مستقرة جداً لبيئات الـ CI
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        # أضفت خيار --stacktrace لإظهار التفاصيل إذا حدث خطأ في الـ API 35
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIX-ENGINE-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7 # الاحتفاظ بالملف لمدة 7 أيام لتوفير المساحة
