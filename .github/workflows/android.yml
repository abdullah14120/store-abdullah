name: Build Abdullah Store APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-release:
    name: Native Build & Assembly
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # ⚙️ 1. Core Logic: Environment & Toolchains
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 🚀 إعداد بيئة NDK لتجميع مكتبات الـ C++ (JNI) الخاصة بطبقة الحماية
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c 

      # 🛠️ تم التصحيح: توليد Gradle Wrapper بإصدار 8.4 ليتوافق مع Kotlin 2.1.0 وإعداداتنا السابقة
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ==========================================
      # 🛡️ 2. Core Logic: Security & Injection
      # ==========================================
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/fixengine.jks

      # 🔥 التعديل الحرج: حقن ملف إعدادات Firebase لمنع انهيار بلجن google-services أثناء البناء
      # تأكد من إضافة GOOGLE_SERVICES_JSON_BASE64 إلى Github Secrets
      - name: Decode Google Services JSON
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      # ==========================================
      # 🚀 3. Core Logic: Build Engine
      # ==========================================
      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: fixengine.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # ⚡ تفعيل التخزين المؤقت والمعالجة المتوازية لتسريع البناء
        run: ./gradlew assembleRelease --build-cache --parallel --no-daemon

      # ==========================================
      # 📦 4. UI / Presentation: Artifact Distribution
      # ==========================================
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Abdullah-Store-Build-${{ github.run_number }}
          # 🎯 تم تحسين المسار ليكون دقيقاً لملفات الـ Release فقط
          path: app/build/outputs/apk/release/*.apk
          retention-days: 5
