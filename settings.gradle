pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // PREFER_SETTINGS هي الأسلوب الاحترافي لمنع تعارض المستودعات في المشاريع الكبيرة
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    
    repositories {
        google()
        mavenCentral()
        
        // تعديل JitPack ليكون أكثر أماناً وتوافقاً مع Gradle 8+
        maven { 
            url = uri("https://jitpack.io") 
        }
    }
}

// اسم المشروع العالمي الخاص بك
rootProject.name = "FIX ENGINE"

// تضمين الموديول الرئيسي
include ':app'
