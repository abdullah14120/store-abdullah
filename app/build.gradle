plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt' 
}

android {
    namespace 'com.fix.engine.abdullah'
    compileSdk 35 

    defaultConfig {
        applicationId "com.fix.engine.abdullah"
        minSdk 24 
        targetSdk 35
        versionCode 1
        versionName "1.0-FIX"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true 
    }

    // تعطيل الـ Lint والـ DataBinding تماماً لتجنب فشل الـ Merge في GitHub
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled true 
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        dataBinding false // تأكيد التعطيل لمنع خطأ dataBindingMerge
    }

    // منع الـ Jetifier من محاولة تحويل المكتبة اليدوية (يحل مشكلة Failed to transform)
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // 1. السطر السحري: قراءة الملفات المحلية
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    // 2. الربط المباشر مع تجاوز أخطاء التحويل
    // تأكد أن الاسم في GitHub هو تماماً: work-runtime-kotlin-2.11.2.aar
    implementation(files("libs/work-runtime-2.11.2.aar"))

    // 3. مكتبات تابعة ضرورية لعمل WorkManager يدوياً (بدونها سيحدث Crash)
    implementation "androidx.startup:startup-runtime:1.1.1"
    implementation "com.google.guava:listenablefuture:1.0"
    implementation "androidx.sqlite:sqlite-framework:2.4.0"

    // المكتبات الأساسية (إصدارات متوافقة مع SDK 35)
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // الاتصال بالشبكة
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // الصور والـ Coroutines
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // Lifecycle & Activity
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.multidex:multidex:2.0.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
