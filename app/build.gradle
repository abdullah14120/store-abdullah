plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize' // 🚀 تم إضافة دعم Parcelize هنا
    id 'com.google.gms.google-services' 
}

android {
    namespace 'com.fix.engine.abdullah'
    compileSdk 35 

    // 🚀 دمج ميزات البناء (Build Features) في بلوك واحد
    buildFeatures {
        buildConfig true
        viewBinding true 
    }

    signingConfigs {
        release {
            // 🛠️ تم التصحيح الفعلي: توحيد الاسم الاحتياطي ليتوافق مع ملف جيت هاب لمنع أي خطأ تضارب
            storeFile file(System.getenv("SIGNING_STORE_FILE") ?: "fixengine.jks")
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    } 

    defaultConfig {
        applicationId "com.fix.engine.abdullah"
        minSdk 23
        targetSdk 35
        versionCode 3 
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true 
        
        // 🛡️ [إضافة هامة] تحديد المعماريات المدعومة لملفات NDK (لتقليل حجم الـ APK)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled true 
            shrinkResources true
            signingConfig signingConfigs.release 
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // 🛠️ تم التصحيح: إغلاق بلوك packagingOptions بشكل سليم
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    // 🛠️ تم التصحيح: نقل externalNativeBuild ليكون داخل بلوك android بشكل مباشر
    externalNativeBuild {
        cmake {
            path file('CMakeLists.txt')
            version '3.22.1' 
        }
    }
}

dependencies {
    // 1. المكتبات الأساسية (AndroidX)
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.7.1'

    // 2. مكتبة Material Design 3 
    implementation 'com.google.android.material:material:1.12.0'

    // 3. دعم التبويبات والـ ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // 4. إدارة البيانات والاتصال (Retrofit)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // 5. معالجة الصور (Glide)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    // 6. العمليات في الخلفية (WorkManager & Coroutines)
    def work_version = "2.9.1"
    implementation "androidx.work:work-runtime-ktx:$work_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'

    // 7. قاعدة البيانات المحلية (Room)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.sqlite:sqlite-framework:2.4.0"

    // 8. تحسين واجهة المستخدم (UI Extras)
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // 9. Lifecycle (ViewModel & LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'

    // 10. MultiDex و الـ Layouts المتقدمة
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"

    // 11. 🛠️ تم الإضافة: الهيكل القياسي الموحد لخدمات الفايربيس لضمان استقرار قنوات الاتصال
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.google.firebase:firebase-common-ktx'
    
    // 12. مكتبة Fetch لتحميل الملفات بسرعة فائقة ودعم تعدد المسارات
    implementation 'com.github.tonyofrancis.Fetch:xfetch2:3.1.6'

    // الاختبارات
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
