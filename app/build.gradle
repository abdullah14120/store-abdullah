plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // تم حذف ButterKnife plugin لعدم الحاجة إليه بعد الآن
}

android {
    namespace 'com.fix.engine.abdullah'
    compileSdk 34 // أحدث إصدار مستقر

    defaultConfig {
        applicationId "com.fix.engine.abdullah"
        minSdk 24 // دعم واسع للأجهزة (Android 7.0+)
        targetSdk 34
        versionCode 1
        versionName "1.0-FIX"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true // تفعيل حماية الكود وتصغير الحجم
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // توقيع التطبيق باسمك (Abdullah Al-Tamimi) سيتم هنا لاحقاً
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // تفعيل الـ ViewBinding (البديل الحديث لـ ButterKnife)
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // المكتبات الأساسية
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // النواة: Kotlin Coroutines (بديل RxJava للأداء العالي)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // إدارة دورة حياة التطبيق (ViewModel & LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // مكتبات الربط الشبكي (للاتصال بالمستودعات)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // معالجة الصور (Glide)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // التحميلات (Fetch) - النسخة المتوافقة مع Android 13+
    implementation "androidx.tonyodev.fetch2:fetch2:3.1.6"

    // الاختبارات
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
